<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAcademy - Зворотній зв’язок</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header, footer { background-color: #2c3e50; color: #fff; padding: 1rem; }
        .container { padding: 20px; max-width: 700px; margin: 0 auto; }
        fieldset { border: 1px solid #0056b3; border-radius: 5px; padding: 15px; margin-bottom: 20px; }
        legend { font-weight: bold; color: #0056b3; padding: 0 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"], select, textarea {
            width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        .radio-group label { font-weight: normal; display: inline-block; margin-right: 15px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-reset { background: #e74c3c; }
        .btn-link { display: inline-block; padding: 8px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" alt="CodeAcademy Logo" width="50" height="50">
            <h1>CodeAcademy — Зворотній зв’язок</h1>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="btn-link">&larr; Перейти на Головну сторінку</a>

        <h2>Форма зворотнього зв'язку</h2>

        <form action="#" method="post">

            <!-- Групування полів 1, 2, 3, 4 -->
            <fieldset>
                <legend>Персональна інформація</legend>

                <div class="form-group">
                    <label for="fullname">Прізвище та ім’я *</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Іванов Іван">
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.com">
                </div>

                <div class="form-group">
                    <label for="age">Вік *</label>
                    <input type="number" id="age" name="age" min="10" max="100" required placeholder="18">
                </div>

                <div class="form-group radio-group">
                    <label>Чи вже вивчаєте мову *?</label>
                    <label><input type="radio" name="experience" value="pro" required> так, я профі</label><br>
                    <label><input type="radio" name="experience" value="beginner"> так, але знаю початковими знаннями</label><br>
                    <label><input type="radio" name="experience" value="planning"> планую</label><br>
                    <label><input type="radio" name="experience" value="no"> ні</label>
                </div>
            </fieldset>

            <!-- Решта полів форми -->
            <div class="form-group">
                <label for="goal">Мета зворотнього зв’язку</label>
                <select id="goal" name="goal">
                    <option value="cooperation">співпраця</option>
                    <option value="complaint">скарга на неякісний контент</option>
                    <option value="proposal">пропозиція</option>
                    <option value="bug">наявність помилки</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Детально (макс. 500 символів):</label>
                <textarea id="details" name="details" rows="6" cols="50" maxlength="500" placeholder="Опишіть ваше звернення детальніше..."></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="consent" required> Я даю згоду на обробку моїх персональних даних *
                </label>
            </div>

            <div class="btn-group">
                <input type="submit" value="Надіслати" class="btn">
                <input type="reset" value="Очистити" class="btn btn-reset">
            </div>

        </form>
    </div>

    <footer>
        <p>&copy; 2026 CodeAcademy. Всі права захищені.</p>
    </footer>

</body>
</html>
